name: kpi_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.0.4+34

environment:
  sdk: ">=2.12.0 <3.0.0"
dependencies:

  flutter:
    sdk: flutter
  animated_splash_screen: ^1.1.0
  flutter_svg:
  provider:
  rive_splash_screen: ^0.1.0
  rive_loading:
  sqflite:

  cupertino_icons: ^1.0.4
  rive: ^0.8.1
  shared_preferences: ^2.0.13
  intl: ^0.17.0
  flutter_widget_from_html_core: ^0.8.5+3
  url_launcher: ^6.1.2
  pdf: ^3.8.3
  path_provider: ^2.0.11
  open_document: ^1.0.5
  shamsi_date: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.4
  flutter_launcher_icons: ^0.9.2

flutter_icons:
  android: true
  image_path: "assets/images/LogoLowRes.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/database/
    - assets/animation/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir_Regular_UI.ttf
        - asset: assets/fonts/Vazir-Bold-Ui.ttf
          weight: 600
    - family: IranSans
      fonts:
        - asset: assets/fonts/Iran_sans.ttf 