name: kpi_app
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 4.0.1+40

environment:
  sdk: ">=2.17.0 <3.0.0"
dependencies:
  animated_splash_screen: ^1.3.0
  auto_direction: ^0.0.6
  bidi: ^2.0.10
  cupertino_icons: ^1.0.5
  encrypt: ^5.0.3
  file_picker: any
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_svg: null
  flutter_widget_from_html_core: ^0.10.5
  intl: ^0.17.0
  open_file: ^3.3.2
  path_provider: ^2.1.1
  pdf: ^3.10.4
  provider: null
  rive: ^0.11.17
  rive_loading: null
  rive_splash_screen: ^0.1.1
  shamsi_date: ^1.0.2
  shared_preferences: ^2.2.1
  sqflite: null
  url_launcher: ^6.1.14
  app_links: ^3.4.5
  auto_route: ^7.8.3

dev_dependencies:
  build_runner: ^2.4.6
  auto_route_generator: ^7.3.1
  flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  image_path: "assets/images/new_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/database/
    - assets/animation/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir_Regular_UI.ttf
        - asset: assets/fonts/Vazir-Bold-Ui.ttf
          weight: 600
    - family: IranSans
      fonts:
        - asset: assets/fonts/Iran_sans.ttf
