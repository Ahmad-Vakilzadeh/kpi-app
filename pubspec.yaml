name: kpi_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.0.6+36

environment:
  sdk: '>=2.12.0 <3.0.0'
dependencies:
  animated_splash_screen: ^1.3.0
  auto_direction: ^0.0.6
  bidi: ^2.0.0
  cupertino_icons: ^1.0.5
  encrypt: ^5.0.1
  file_picker: any
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.10.0
  flutter_svg: null
  flutter_widget_from_html_core: ^0.8.5+3
  intl: ^0.17.0
  open_file: ^3.2.1
  path_provider: ^2.0.11
  pdf: ^3.8.3
  provider: null
  rive: ^0.9.1
  rive_loading: null
  rive_splash_screen: ^0.1.1
  shamsi_date: ^1.0.1
  shared_preferences: ^2.0.15
  sqflite: null
  url_launcher: ^6.1.6

dev_dependencies:
  flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  image_path: 'assets/images/new_logo.png'

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/database/
    - assets/animation/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir_Regular_UI.ttf
        - asset: assets/fonts/Vazir-Bold-Ui.ttf
          weight: 600
    - family: IranSans
      fonts:
        - asset: assets/fonts/Iran_sans.ttf
