name: kpi_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  animated_splash_screen: ^1.1.0
  flutter_svg:
  provider:
  rive_splash_screen: ^0.1.0
  rive_loading:
  sqflite:

  cupertino_icons: ^1.0.2
  rive: ^0.7.33
  shared_preferences: ^2.0.12
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  flutter_launcher_icons: ^0.9.2

flutter_icons:
  android: true
  image_path: "assets/images/LogoLowRes.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/database/
    - assets/animation/

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Regular-UI.ttf
        - asset: assets/fonts/Vazir-Bold-Ui.ttf
          weight: 700
        - asset: assets/fonts/Vazir-Black-Ui.ttf